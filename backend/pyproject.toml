[project]
name = "citypulse"
version = "0.1.0"
description = "CityPulse backend: bike-share availability from the BIXI GBFS feed."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
# Supply-chain cooldown: resolve only releases published before this date, set about two weeks
# before the last dependency update. Move it forward on purpose when updating, then re-lock.
exclude-newer = "2026-10-11T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
