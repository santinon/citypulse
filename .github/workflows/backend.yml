# Backend quality gate: the same commands as AGENTS.md "Commands", run from backend/.
# No path filter: the check must report on every pull request, because branch protection
# requires it. Third-party actions are pinned to full commit SHAs (tag in the comment).
name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "postgresql+psycopg://citypulse:citypulse_ci@127.0.0.1:5432/citypulse_test"
      REQUIRE_DB: "1"
    services:
      db:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: citypulse_test
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: citypulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
