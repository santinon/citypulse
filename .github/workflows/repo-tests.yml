# Repository-level tests: the audit script (issue #2) and the agent policy (shared guard, git
# hooks), with the same commands as AGENTS.md "Commands". Linux runner: guard cases that only
# make sense on Windows report SKIP with their reason, and the Codex parts report SKIP.
# No path filter: both checks must report on every pull request once branch protection
# requires them. Third-party actions are pinned to full commit SHAs (tag in the comment).
name: repo-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Same supply-chain cooldown as backend/pyproject.toml ([tool.uv] exclude-newer).
      UV_EXCLUDE_NEWER: "2026-10-11T00:00:00Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: .github/workflows/repo-tests.yml
      - run: uv run --python 3.12 --no-project --with pytest==8.4.2 --with geographiclib==2.0 pytest tests/audit -q

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/policy/run_all.py
